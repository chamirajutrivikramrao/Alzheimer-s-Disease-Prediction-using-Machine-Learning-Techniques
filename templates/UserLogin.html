{% extends 'base.html' %}
{% load static %}
{% block contents %}

<style>
.login-bg {
    min-height: 100vh;
    background-image: url("{% static 'images/admin.jpg' %}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}
</style>

<section class="login-bg d-flex align-items-center justify-content-center">
    <div class="container text-center text-white">

        <div class="container py-5">
            <div class="row text-center py-3">
                <div class="col-12 col-md-4 offset-md-4 mb-4">
                    <div class="card"
                         style="background-color: rgba(255, 255, 255, 0.85);
                                padding: 30px 25px;
                                border-radius: 8px;">

                        <h1 class="h4 mb-3 text-primary font-weight-bold">
                            User Login Form
                        </h1>

                        <form action="{% url 'UserLoginCheck' %}" method="POST">
                            {% csrf_token %}

                            <div class="form-group">
                                <input type="text"
                                       class="form-control"
                                       name="loginid"
                                       required
                                       placeholder="Enter Login ID">
                            </div>

                            <div class="form-group">
                                <input type="password"
                                       class="form-control"
                                       name="pswd"
                                       required
                                       placeholder="Enter Password">
                            </div>

                            <div class="d-flex justify-content-between">
                                <button class="btn btn-primary px-4" type="submit">
                                    Login
                                </button>
                                <button class="btn btn-secondary px-4" type="reset">
                                    Reset
                                </button>
                            </div>

                            {% if messages %}
                                {% for message in messages %}
                                    <div class="text-success mt-2">
                                        {{ message }}
                                    </div>
                                {% endfor %}
                            {% endif %}
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
